<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆氣象站 80 週年 - 管理員後台與投票統計</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 圖表庫 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        input[type="datetime-local"] {
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <main class="max-w-6xl mx-auto w-full space-y-6">
        <!-- 頂部標題區 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
            <div>
                <span class="bg-sky-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">管理員專用</span>
                <h1 class="text-3xl font-bold text-white mt-2">氣象預測投票後台與統計</h1>
                <p class="text-sm text-slate-400">依時間區間篩選、檢視投票明細與數據圖表分析</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm transition border border-slate-700">查看前台網頁 ↗</a>
                <button onclick="loadVotes()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow">重新整理數據</button>
            </div>
        </div>

        <!-- 篩選控制列 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-800 p-5 rounded-2xl border border-slate-700 text-sm shadow-lg">
            <div>
                <label class="block text-slate-300 mb-1 font-medium">開始時間篩選</label>
                <input type="datetime-local" id="filterStart" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-medium">結束時間篩選</label>
                <input type="datetime-local" id="filterEnd" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-end gap-2">
                <button onclick="filterVotes()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition shadow">套用時間區間</button>
                <button onclick="resetFilter()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl transition">重設</button>
            </div>
        </div>

        <!-- 統計摘要數字 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center shadow">
                <div class="text-xs text-slate-400 font-medium">總投票數量 (提交總次數)</div>
                <div id="statTotalSubmissions" class="text-3xl font-bold text-sky-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center shadow">
                <div class="text-xs text-slate-400 font-medium">獨立投票人數 (手機號碼去重)</div>
                <div id="statUniqueUsers" class="text-3xl font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center shadow">
                <div class="text-xs text-slate-400 font-medium">最多人預測選項 (含同票並列)</div>
                <div id="statTop" class="text-lg font-bold text-amber-400 mt-2 truncate">-</div>
            </div>
        </div>

        <!-- 圖表分析區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col items-center">
                <h3 class="text-sm font-bold text-slate-300 mb-4 self-start">📈 各預測選項票數柱狀圖</h3>
                <div class="w-full h-64 flex items-center justify-center">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col items-center">
                <h3 class="text-sm font-bold text-slate-300 mb-4 self-start">🥧 各預測選項比例圓餅圖</h3>
                <div class="w-full h-64 flex items-center justify-center">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 投票明細清單表格 (可切換最近/最初 100 筆) -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 font-bold text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <span>投票明細記錄列表</span>
                    <span id="tableCountTip" class="text-xs text-slate-400 font-normal ml-2"></span>
                </div>
                <!-- 切換顯示按鈕群組 -->
                <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700 text-xs">
                    <button onclick="switchViewMode('recent')" id="btnRecent" class="px-3 py-1.5 rounded-lg font-medium transition bg-sky-600 text-white shadow">最近 100 筆</button>
                    <button onclick="switchViewMode('oldest')" id="btnOldest" class="px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white">最初 100 筆</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-xs uppercase text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-3">投票時間</th>
                            <th class="px-6 py-3">姓名 / 暱稱</th>
                            <th class="px-6 py-3">手機號碼</th>
                            <th class="px-6 py-3">預測天氣選項</th>
                        </tr>
                    </thead>
                    <tbody id="voteTableBody" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-slate-500">正在載入投票資料...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="text-center text-slate-500 text-xs py-8 mt-12 border-t border-slate-800">
        <p>基隆氣象站建站 80 週年紀念活動後台管理系統 © 2026</p>
    </footer>

    <!-- 後台資料載入、圖表與篩選邏輯 -->
    <script>
        let GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyQ_BMo5AXB4OOa4tT1EWX16cvB9irzlXQnK7qlAKyRa7z5zhHdnQfds9Zw-DiABgr_/exec"; 

        let globalData = [];
        let currentViewMode = 'recent'; 
        let barChartInstance = null;
        let pieChartInstance = null;

        async function loadVotes() {
            let data = [];
            if (GOOGLE_SHEET_API_URL) {
                try {
                    const response = await fetch(GOOGLE_SHEET_API_URL);
                    data = await response.json();
                } catch (e) {
                    console.error("無法讀取 Google Sheets", e);
                    data = [];
                }
            }
            
            globalData = data.map(v => ({
                time: v["時間 (Timestamp)"] || v.time || v.時間 || new Date().toISOString(),
                name: v["姓名 (Name)"] !== undefined ? v["姓名 (Name)"] : (v.name || v.姓名 || ''),
                phone: String(v["手機號碼 (Phone)"] !== undefined ? v["手機號碼 (Phone)"] : (v.phone || v.手機號碼 || '')).trim(),
                prediction: v["預測天氣選項 (Prediction)"] || v.prediction || v.預測天氣選項 || ''
            }));

            renderStatsAndTable(globalData);
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            const btnRecent = document.getElementById('btnRecent');
            const btnOldest = document.getElementById('btnOldest');

            if (mode === 'recent') {
                btnRecent.className = "px-3 py-1.5 rounded-lg font-medium transition bg-sky-600 text-white shadow";
                btnOldest.className = "px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white";
            } else {
                btnOldest.className = "px-3 py-1.5 rounded-lg font-medium transition bg-sky-600 text-white shadow";
                btnRecent.className = "px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white";
            }

            filterVotes();
        }

        function renderStatsAndTable(data) {
            const tbody = document.getElementById('voteTableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">目前尚無任何投票資料</td></tr>`;
                document.getElementById('statTotalSubmissions').innerText = '0';
                document.getElementById('statUniqueUsers').innerText = '0';
                document.getElementById('statTop').innerText = '-';
                updateCharts({ '1.晴天': 0, '2.降雨': 0, '3.水龍捲': 0, '4.下雪': 0 });
                document.getElementById('tableCountTip').innerText = '';
                return;
            }

            // 1. 總投票數量
            const totalSubmissions = data.length;
            document.getElementById('statTotalSubmissions').innerText = totalSubmissions;

            // 2. 獨立投票人數 (手機號碼去重)
            const uniquePhones = new Set(data.map(v => v.phone).filter(p => p !== ''));
            document.getElementById('statUniqueUsers').innerText = uniquePhones.size;

            // 3. 各選項統計
            let counts = { '1.晴天': 0, '2.降雨': 0, '3.水龍捲': 0, '4.下雪': 0 };
            data.forEach(v => {
                let opt = String(v.prediction);
                if (opt.includes('晴')) opt = '1.晴天';
                else if (opt.includes('雨')) opt = '2.降雨';
                else if (opt.includes('水龍捲')) opt = '3.水龍捲';
                else if (opt.includes('雪')) opt = '4.下雪';

                if (counts[opt] !== undefined) {
                    counts[opt]++;
                }
            });

            // 4. 最多人預測選項（支援同票並列顯示）
            let maxCount = -1;
            let topOpts = [];
            for (let opt in counts) {
                if (counts[opt] > maxCount) {
                    maxCount = counts[opt];
                    topOpts = [opt];
                } else if (counts[opt] === maxCount && maxCount > 0) {
                    topOpts.push(opt);
                }
            }
            
            let topText = '-';
            if (maxCount > 0) {
                topText = topOpts.join('、') + ` (${maxCount}票)`;
            }
            document.getElementById('statTop').innerText = topText;

            // 更新圖表
            updateCharts(counts);

            // 5. 處理列表顯示：最近100筆或最初100筆
            let displayData = [];
            if (currentViewMode === 'recent') {
                displayData = [...data].reverse().slice(0, 100);
                document.getElementById('tableCountTip').innerText = `（顯示最近 ${displayData.length} 筆，共 ${totalSubmissions} 筆）`;
            } else {
                displayData = [...data].slice(0, 100);
                document.getElementById('tableCountTip').innerText = `（顯示最初 ${displayData.length} 筆，共 ${totalSubmissions} 筆）`;
            }

            displayData.forEach(v => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition";
                const formattedTime = v.time ? new Date(v.time).toLocaleString() : '剛剛';

                tr.innerHTML = `
                    <td class="px-6 py-3.5 text-slate-400 text-xs">${formattedTime}</td>
                    <td class="px-6 py-3.5 font-medium text-white">${v.name}</td>
                    <td class="px-6 py-3.5 font-mono text-slate-300">${v.phone}</td>
                    <td class="px-6 py-3.5"><span class="bg-sky-950 text-sky-300 border border-sky-800/50 px-3 py-1 rounded-full text-xs font-semibold">${v.prediction}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateCharts(counts) {
            const labels = ['1.晴天', '2.降雨', '3.水龍捲', '4.下雪'];
            const values = [counts['1.晴天'], counts['2.降雨'], counts['3.水龍捲'], counts['4.下雪']];
            const backgroundColors = ['#f59e0b', '#3b82f6', '#a855f7', '#06b6d4'];

            if (barChartInstance) barChartInstance.destroy();
            if (pieChartInstance) pieChartInstance.destroy();

            const barCtx = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '票數',
                        data: values,
                        backgroundColor: backgroundColors,
                        borderWidth: 0,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', precision: 0 } }
                    }
                }
            });

            const pieCtx = document.getElementById('pieChart').getContext('2d');
            pieChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: backgroundColors,
                        borderWidth: 2,
                        borderColor: '#1e293b'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#f8fafc', boxWidth: 12 } }
                    }
                }
            });
        }

        function filterVotes() {
            const startVal = document.getElementById('filterStart').value;
            const endVal = document.getElementById('filterEnd').value;
            
            let filtered = [...globalData];

            if (startVal || endVal) {
                const startTime = startVal ? new Date(startVal).getTime() : 0;
                const endTime = endVal ? new Date(endVal).getTime() : Date.now();
                filtered = filtered.filter(v => {
                    const t = new Date(v.time).getTime();
                    return t >= startTime && t <= endTime;
                });
            }
            renderStatsAndTable(filtered);
        }

        function resetFilter() {
            document.getElementById('filterStart').value = '';
            document.getElementById('filterEnd').value = '';
            renderStatsAndTable(globalData);
        }

        window.onload = loadVotes;
    </script>
</body>
</html>
