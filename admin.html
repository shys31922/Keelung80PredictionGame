<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆氣象站 80 週年 - 管理員後台與投票統計</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <main class="max-w-6xl mx-auto w-full space-y-6">
        <!-- 頂部標題區 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
            <div>
                <span class="bg-sky-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">管理員專用</span>
                <h1 class="text-3xl font-bold text-white mt-2">氣象預測投票後台與統計</h1>
                <p class="text-sm text-slate-400">依時間區間篩選、檢視投票明細與各選項統計數據</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm transition border border-slate-700">查看前台網頁 ↗</a>
                <button onclick="loadVotes()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow">重新整理數據</button>
            </div>
        </div>

        <!-- 篩選控制列 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-800 p-5 rounded-2xl border border-slate-700 text-sm shadow-lg">
            <div>
                <label class="block text-slate-300 mb-1 font-medium">開始時間篩選</label>
                <input type="datetime-local" id="filterStart" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-medium">結束時間篩選</label>
                <input type="datetime-local" id="filterEnd" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-end gap-2">
                <button onclick="filterVotes()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition shadow">套用時間區間</button>
                <button onclick="resetFilter()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl transition">重設</button>
            </div>
        </div>

        <!-- 統計摘要數字 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center shadow">
                <div class="text-xs text-slate-400 font-medium">總投票人數</div>
                <div id="statTotal" class="text-3xl font-bold text-sky-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center shadow">
                <div class="text-xs text-slate-400 font-medium">最多人預測選項</div>
                <div id="statTop" class="text-xl font-bold text-emerald-400 mt-2 truncate">-</div>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center col-span-2 shadow">
                <div class="text-xs text-slate-400 font-medium mb-2">選項分佈統計</div>
                <div id="statDist" class="text-xs md:text-sm text-slate-200 flex justify-around font-medium">
                    <span>晴天: 0</span><span>降雨: 0</span><span>水龍捲: 0</span><span>下雪: 0</span>
                </div>
            </div>
        </div>

        <!-- 投票明細清單表格 -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 font-bold text-white flex justify-between items-center">
                <span>投票明細記錄列表</span>
                <span class="text-xs text-slate-400 font-normal">（依手機號碼去重，保留最新一次投票）</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-xs uppercase text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-3">投票時間</th>
                            <th class="px-6 py-3">姓名 / 暱稱</th>
                            <th class="px-6 py-3">手機號碼</th>
                            <th class="px-6 py-3">預測天氣選項</th>
                        </tr>
                    </thead>
                    <tbody id="voteTableBody" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-slate-500">正在載入投票資料...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="text-center text-slate-500 text-xs py-8 mt-12 border-t border-slate-800">
        <p>基隆氣象站建站 80 週年紀念活動後台管理系統 © 2026</p>
    </footer>

    <!-- 後台資料載入與篩選邏輯 -->
    <script>
        // 💡 請在此處填入您 Google Apps Script 的網頁應用程式網址 (需與前台一致)
        let GOOGLE_SHEET_API_URL = ""; 

        let localVotes = JSON.parse(localStorage.getItem('keelung_weather_votes')) || [];

        async function loadVotes() {
            let data = [];
            if (GOOGLE_SHEET_API_URL) {
                try {
                    const response = await fetch(GOOGLE_SHEET_API_URL);
                    data = await response.json();
                } catch (e) {
                    console.error("無法讀取 Google Sheets，改讀取本地暫存", e);
                    data = localVotes;
                }
            } else {
                data = localVotes;
            }
            renderStatsAndTable(data);
        }

        function renderStatsAndTable(data) {
            const tbody = document.getElementById('voteTableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">目前尚無任何投票資料</td></tr>`;
                document.getElementById('statTotal').innerText = '0';
                document.getElementById('statTop').innerText = '-';
                document.getElementById('statDist').innerHTML = `<span>晴天: 0</span><span>降雨: 0</span><span>水龍捲: 0</span><span>下雪: 0</span>`;
                return;
            }

            document.getElementById('statTotal').innerText = data.length;

            let counts = { '1.晴天': 0, '2.降雨': 0, '3.水龍捲': 0, '4.下雪': 0 };
            data.forEach(v => {
                const opt = v.prediction || v.預測天氣選項 || '';
                if (counts[opt] !== undefined) {
                    counts[opt]++;
                }
            });

            let topOpt = '-';
            let maxCount = -1;
            for (let opt in counts) {
                if (counts[opt] > maxCount) {
                    maxCount = counts[opt];
                    topOpt = opt;
                }
            }
            document.getElementById('statTop').innerText = maxCount > 0 ? topOpt : '-';
            document.getElementById('statDist').innerHTML = `
                <span class="text-amber-300">☀️ 晴天: ${counts['1.晴天']}</span>
                <span class="text-blue-300">🌧️ 降雨: ${counts['2.降雨']}</span>
                <span class="text-purple-300">🌪️ 水龍捲: ${counts['3.水龍捲']}</span>
                <span class="text-sky-300">❄️ 下雪: ${counts['4.下雪']}</span>
            `;

            data.slice().reverse().forEach(v => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition";
                const timeVal = v.time || v.時間 || '';
                const formattedTime = timeVal ? new Date(timeVal).toLocaleString() : '剛剛';
                const nameVal = v.name || v.姓名 || '';
                const phoneVal = v.phone || v.手機號碼 || '';
                const predVal = v.prediction || v.預測天氣選項 || '';

                tr.innerHTML = `
                    <td class="px-6 py-3.5 text-slate-400 text-xs">${formattedTime}</td>
                    <td class="px-6 py-3.5 font-medium text-white">${nameVal}</td>
                    <td class="px-6 py-3.5 font-mono text-slate-300">${phoneVal}</td>
                    <td class="px-6 py-3.5"><span class="bg-sky-950 text-sky-300 border border-sky-800/50 px-3 py-1 rounded-full text-xs font-semibold">${predVal}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function filterVotes() {
            const startVal = document.getElementById('filterStart').value;
            const endVal = document.getElementById('filterEnd').value;
            
            let data = [];
            if (GOOGLE_SHEET_API_URL) {
                try {
                    data = await (await fetch(GOOGLE_SHEET_API_URL)).json();
                } catch(e) {
                    data = localVotes;
                }
            } else {
                data = localVotes;
            }

            if (startVal || endVal) {
                const startTime = startVal ? new Date(startVal).getTime() : 0;
                const endTime = endVal ? new Date(endVal).getTime() : Date.now();
                data = data.filter(v => {
                    const t = new Date(v.time || v.時間).getTime();
                    return t >= startTime && t <= endTime;
                });
            }
            renderStatsAndTable(data);
        }

        function resetFilter() {
            document.getElementById('filterStart').value = '';
            document.getElementById('filterEnd').value = '';
            loadVotes();
        }

        window.onload = loadVotes;
    </script>
</body>
</html>
